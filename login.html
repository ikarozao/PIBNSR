<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Login - PIB NSR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="container">
      <div class="logo-area">
        <a href="index.html"><img src="img/logo.png" alt="PIB NSR logo" class="logo-img"></a>
      </div>
      <nav class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> <span>Início</span></a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-box">
        <h2 class="section-title"><i class="fas fa-lock"></i> Login</h2>

        <form id="loginForm" class="auth-form">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com">

          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="••••••••">

          <button type="submit" class="auth-btn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
        </form>

        <p id="authMessage" class="auth-message"></p>

        <p class="auth-hint">
          Ainda não tem uma conta? Peça a um administrador para criar seu acesso
          no <a href="admin-users.html">painel de administradores</a> (só quem já é admin consegue criar novos logins).
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span><i class="fas fa-cross"></i> Primeira Igreja Batista em Nova Santa Rosa</span>
        <span><i class="far fa-copyright"></i> PIB NSR 2025</span>
      </div>
    </div>
  </footer>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('authMessage');

    // Se já estiver logado, manda direto pro painel
    getCurrentUser().then((user) => {
      if (user) window.location.href = 'admin.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      messageEl.textContent = 'Entrando...';
      messageEl.className = 'auth-message';

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        messageEl.textContent = traduzErro(error.message);
        messageEl.className = 'auth-message error';
        return;
      }
      window.location.href = 'admin.html';
    });

    function traduzErro(msg) {
      if (msg.includes('Invalid login credentials')) return 'E-mail ou senha incorretos.';
      if (msg.includes('Email not confirmed')) return 'E-mail ainda não confirmado.';
      return 'Não foi possível entrar. Verifique seus dados.';
    }
  </script>
</body>
</html>
