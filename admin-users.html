<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Administradores - PIB NSR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="container">
      <div class="logo-area">
        <a href="index.html"><img src="img/logo.png" alt="PIB NSR logo" class="logo-img"></a>
      </div>
      <nav class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> <span>Início</span></a>
        <a href="admin.html"><i class="fas fa-calendar-check"></i> <span>Agenda</span></a>
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h2 class="section-title"><i class="fas fa-user-shield"></i> Administradores</h2>
      <p class="auth-hint">
        Aqui você cria o login de novas pessoas e dá (ou remove) a permissão de administrador.
        Novos usuários entram com o e-mail e senha que você definir abaixo.
      </p>

      <div class="auth-box">
        <h3><i class="fas fa-user-plus"></i> Criar novo administrador</h3>
        <form id="createForm" class="auth-form">
          <label for="newEmail">E-mail</label>
          <input type="email" id="newEmail" required placeholder="pessoa@email.com">

          <label for="newPassword">Senha (mín. 6 caracteres)</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="••••••••">

          <button type="submit" class="auth-btn"><i class="fas fa-user-plus"></i> Criar acesso admin</button>
        </form>
        <p id="createMsg" class="auth-message"></p>
      </div>

      <h3 class="section-title" style="margin-top:2rem;"><i class="fas fa-list"></i> Administradores atuais</h3>
      <div id="adminList" class="admin-event-list"><!-- gerado via JS --></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span><i class="fas fa-cross"></i> Primeira Igreja Batista em Nova Santa Rosa</span>
        <span><i class="far fa-copyright"></i> PIB NSR 2025</span>
      </div>
    </div>
  </footer>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    let me = null;
    protectPage({ requireAdmin: true }).then(async (user) => {
      me = user;
      await loadAdmins();
    });

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    async function loadAdmins() {
      const listEl = document.getElementById('adminList');
      listEl.innerHTML = 'Carregando...';
      const { data, error } = await supabase.from('admins').select('user_id, email');

      if (error) {
        listEl.innerHTML = '<p>Erro ao carregar administradores.</p>';
        console.error(error);
        return;
      }

      listEl.innerHTML = '';
      if (!data || data.length === 0) {
        listEl.innerHTML = '<p>Nenhum administrador cadastrado ainda.</p>';
        return;
      }
      data.forEach(row => {
        const el = document.createElement('div');
        el.className = 'admin-event-card admin-user-row';
        el.innerHTML = `
          <span><i class="fas fa-user"></i> ${row.email || row.user_id}</span>
          <button class="remove-event-btn remove-admin-btn" data-uid="${row.user_id}" title="Remover permissão de admin">
            <i class="fas fa-user-slash"></i>
          </button>
        `;
        listEl.appendChild(el);
      });

      listEl.querySelectorAll('.remove-admin-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const uid = btn.dataset.uid;
          if (uid === me.id) {
            alert('Você não pode remover sua própria permissão de admin por aqui.');
            return;
          }
          if (confirm('Remover permissão de administrador deste usuário?')) {
            await supabase.from('admins').delete().eq('user_id', uid);
            loadAdmins();
          }
        });
      });
    }

    // ----------------------------------------------------------------
    // IMPORTANTE: criar um novo usuário de autenticação a partir do
    // painel exige privilégios de administrador do projeto (chave
    // "service_role"), que NUNCA deve ficar no código do site (isso
    // permitiria qualquer visitante criar contas). Por isso, o fluxo
    // seguro é: o admin cria a conta no Supabase Dashboard e depois
    // cola aqui o UID pra liberar a permissão de admin.
    // ----------------------------------------------------------------
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('createMsg');
      msg.className = 'auth-message';
      msg.innerHTML = `
        Por segurança, não é possível criar a conta de outra pessoa direto
        por aqui. Passo rápido:<br>
        1. Vá no <a href="https://supabase.com/dashboard" target="_blank">Supabase Dashboard</a> →
        seu projeto → Authentication → Users → "Add user".<br>
        2. Crie o e-mail/senha da pessoa e marque <b>"Auto Confirm User"</b>.<br>
        3. Copie o <b>UID</b> gerado e cole no campo abaixo para liberar o acesso admin.
      `;
      if (!document.getElementById('uidField')) {
        const wrap = document.createElement('div');
        wrap.id = 'uidField';
        wrap.innerHTML = `
          <label>UID do usuário (copiado do Supabase Dashboard)</label>
          <input type="text" id="newUid" placeholder="ex: 3fa85f64-5717-4562-...">
          <label>E-mail (para exibir na lista)</label>
          <input type="text" id="newUidEmail" value="${document.getElementById('newEmail').value}">
          <button type="button" id="confirmAdminBtn" class="auth-btn"><i class="fas fa-check"></i> Confirmar e liberar acesso admin</button>
        `;
        document.getElementById('createForm').appendChild(wrap);
        document.getElementById('confirmAdminBtn').addEventListener('click', async () => {
          const uid = document.getElementById('newUid').value.trim();
          const email = document.getElementById('newUidEmail').value.trim();
          if (!uid) { alert('Cole o UID do usuário.'); return; }

          const { error } = await supabase.from('admins').insert({ user_id: uid, email });
          if (error) {
            msg.textContent = 'Erro: ' + error.message;
            msg.className = 'auth-message error';
            return;
          }
          msg.textContent = 'Administrador adicionado com sucesso!';
          msg.className = 'auth-message success';
          document.getElementById('uidField').remove();
          document.getElementById('createForm').reset();
          loadAdmins();
        });
      }
    });
  </script>
</body>
</html>
